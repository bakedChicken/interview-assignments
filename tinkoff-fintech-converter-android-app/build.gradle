// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        // App version
        versionName = '2.0.0'
        versionCodeBase = 2000

        // SDK and tools
        compileSdkVersion = 28
        minSdkVersion = 23
        targetSdkVersion = 28

        // App dependencies
        androidGradlePluginVersion = '3.3.0'
        appcompatVersion = '1.1.0-alpha01'
        constraintLayoutVersion = '1.1.3'
        crashlyticsVersion = '2.9.5'
        espressoVersion = '3.1.0-alpha1'
        fabricVersion = '1.25.4'
        kotlinVersion = '1.3.20'
        koinVersion = '1.0.0-RC-3'
        lifecycleVersion = '2.1.0-alpha01'
        materialVersion = '1.1.0-alpha02'
        okhttpVersion = '3.10.0'
        retrofitVersion = '2.4.0'
        rxjavaVersion = '2.2.2'
        rxandroidVersion = '2.1.0'
        rxkotlinVersion = '2.3.0'
    }
    repositories {
        google()
        jcenter()
        maven {
            url 'https://maven.fabric.io/public'
        }
    }
    dependencies {
        classpath "com.android.tools.build:gradle:$androidGradlePluginVersion"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"
        classpath "io.fabric.tools:gradle:$fabricVersion"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        jcenter()
        maven {
            url 'https://maven.fabric.io/public'
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
