<!DOCTYPE html>
<html lang="ru">
  <head>
    <title>Promise Queue</title>

    <style>
      body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      #root {
        display: inline-grid;
        grid-template-columns: repeat(4, 1fr);
        grid-column-gap: 0.5rem;
        grid-row-gap: 1rem;
      }

      #root > textarea {
        grid-column: 1 / 5;
        height: 200px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="app/app.tsx"></script>
  </body>
</html>
